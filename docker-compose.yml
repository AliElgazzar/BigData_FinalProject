name: wikimedia-bigdata-final

services:
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    container_name: wikimedia-bigdata-final-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=wikimedia-hdfs
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_replication=1

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_replication=1
    depends_on:
      - namenode

  hive-metastore-db:
    image: postgres:16
    container_name: wikimedia-bigdata-final-hive-metastore-db-1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - hive_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20

  hive-metastore:
    image: apache/hive:4.1.0
    container_name: wikimedia-bigdata-final-hive-metastore-1
    volumes:
      - ./hive-lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
        -Dfs.defaultFS=hdfs://namenode:9000
        -Dhive.server2.enable.doAs=false

  hive-server:
    image: apache/hive:4.1.0
    container_name: wikimedia-bigdata-final-hive-server-1
    volumes:
      - ./hive-lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
    depends_on:
      - hive-metastore
      - namenode
      - datanode
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: hiveserver2
      SKIP_SCHEMA_INIT: "true"
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
        -Dfs.defaultFS=hdfs://namenode:9000
        -Dhive.server2.enable.doAs=false

  hdfs-init:
    image: bde2020/hadoop-base:2.0.0-hadoop3.2.1-java8
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    volumes:
      - ./data/wiki_reference.csv:/data/local/wiki_reference.csv:ro
      - ./hdfs/upload_reference_data.sh:/upload_reference_data.sh:ro
    entrypoint: ["/bin/bash", "/upload_reference_data.sh"]
    depends_on:
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    restart: "no"

  hive-init:
    image: apache/hive:4.1.0
    container_name: wikimedia-bigdata-final-hive-init-1
    volumes:
      - ./hive/init_hive.sql:/init_hive.sql:ro
      - ./hive-lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
    environment:
      SERVICE_NAME: hiveserver2
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for i in {1..90}; do
          if beeline -u jdbc:hive2://hive-server:10000 -e "show databases" >/dev/null 2>&1; then
            break
          fi
          sleep 5
          if [ "$$i" -eq 90 ]; then
            exit 1
          fi
        done
        beeline -u jdbc:hive2://hive-server:10000 -f /init_hive.sql
    depends_on:
      hive-server:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
    restart: "no"

  producer:
    build:
      context: ./producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: wikimedia-recent-change
    depends_on:
      kafka:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
      hive-init:
        condition: service_completed_successfully
    restart: unless-stopped

  spark-streaming:
    build:
      context: ./spark
    user: "0:0"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: wikimedia-recent-change
      HDFS_REFERENCE_CSV: hdfs://namenode:9000/data/wiki_reference.csv
      SPARK_CHECKPOINT_LOCATION: hdfs://namenode:9000/checkpoints/wikimedia_structured_streaming
      HIVE_METASTORE_URIS: thrift://hive-metastore:9083
      SPARK_WAREHOUSE_DIR: hdfs://namenode:9000/user/hive/warehouse
      HADOOP_DEFAULT_FS: hdfs://namenode:9000
      SPARK_TRIGGER_SECONDS: "15"
      KAFKA_STARTING_OFFSETS: latest
      HOME: /tmp
      IVY_HOME: /tmp/.ivy2
      SPARK_SUBMIT_OPTS: -Divy.home=/tmp/.ivy2 -Divy.cache.dir=/tmp/.ivy2/cache
    depends_on:
      kafka:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
      hive-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_started
      namenode:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "8501:8501"
    environment:
      HIVE_HOST: hive-server
      HIVE_PORT: "10000"
      HIVE_DATABASE: bigdata_project
    depends_on:
      hive-server:
        condition: service_started
      hive-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  namenode_data: {}
  datanode_data: {}
  hive_pg_data: {}


